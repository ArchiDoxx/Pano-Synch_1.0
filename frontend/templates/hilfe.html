<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>PanoSync — Hilfe & Anleitung</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d1117;
      color: #c0d0d8;
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,156,171,0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,156,171,0.05) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }
    .page {
      position: relative;
      z-index: 1;
      max-width: 820px;
      margin: 0 auto;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #1e2a38;
    }
    .topbar img { height: 28px; width: auto; opacity: 0.9; }
    .topbar h1 { font-size: 1.1rem; color: #fff; font-weight: 700; }
    .topbar h1 span { color: #009cab; }
    .back-link {
      margin-left: auto;
      color: #3a5060;
      font-size: 0.85rem;
      text-decoration: none;
      padding: 0.3rem 0.7rem;
      border: 1px solid #1e2a38;
      border-radius: 5px;
    }
    .back-link:hover { color: #009cab; border-color: #009cab; }
    /* markdown content */
    .content h1, .content h2, .content h3, .content h4 {
      color: #e0e8f0;
      margin: 1.8rem 0 0.7rem;
      line-height: 1.3;
    }
    .content h1 { font-size: 1.6rem; color: #fff; border-bottom: 1px solid #1e2a38; padding-bottom: 0.4rem; }
    .content h2 { font-size: 1.2rem; color: #009cab; }
    .content h3 { font-size: 1rem; color: #7ac0cc; }
    .content p { line-height: 1.7; margin: 0.6rem 0; color: #a0b8c8; }
    .content ul, .content ol { padding-left: 1.5rem; margin: 0.5rem 0; }
    .content li { line-height: 1.7; color: #a0b8c8; margin-bottom: 0.2rem; }
    .content code {
      background: #131c26;
      border: 1px solid #1e2a38;
      border-radius: 4px;
      padding: 0.1rem 0.4rem;
      font-size: 0.88em;
      color: #009cab;
      font-family: 'Consolas', 'Monaco', monospace;
    }
    .content pre {
      background: #0a1018;
      border: 1px solid #1e2a38;
      border-radius: 8px;
      padding: 1rem;
      overflow-x: auto;
      margin: 0.8rem 0;
    }
    .content pre code {
      background: none;
      border: none;
      padding: 0;
      color: #8ad4de;
      font-size: 0.85rem;
    }
    .content table {
      width: 100%;
      border-collapse: collapse;
      margin: 0.8rem 0;
      font-size: 0.9rem;
    }
    .content th { background: #131c26; color: #009cab; text-align: left; padding: 0.5rem 0.8rem; border: 1px solid #1e2a38; }
    .content td { padding: 0.4rem 0.8rem; border: 1px solid #1e2a38; color: #a0b8c8; }
    .content tr:nth-child(even) td { background: #0a0e14; }
    .content a { color: #009cab; text-decoration: none; }
    .content a:hover { text-decoration: underline; }
    .content blockquote {
      border-left: 3px solid #009cab;
      padding-left: 1rem;
      margin: 0.8rem 0;
      color: #5a8090;
      font-style: italic;
    }
    .content hr { border: none; border-top: 1px solid #1e2a38; margin: 1.5rem 0; }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <img src="/static/onsite-logo.jpg" alt="OnsiteAI">
      <h1>Onsite<span>AI</span> <span style="color:#3a5060;font-weight:400;font-size:0.85rem;">/ PanoSync — Hilfe</span></h1>
      <a class="back-link" id="back-btn" href="/">← Zurück</a>
    </div>
    <script>
      const ref = document.referrer;
      const btn = document.getElementById('back-btn');
      if (ref.includes('/calibrate/')) {
        btn.style.display = 'none';
      }
    </script>
    <div class="content">
      {{ content | safe }}
    </div>
  </div>
</body>
</html>
